<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iRacing Telemetry</title>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,600;1,900&family=Chivo+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0c; --panel:#131315; --panel2:#18181b; --line:#26262a;
  --ink:#f5f5f6; --dim:#9a9aa1;
  --red:#e10600; --red-dark:#7a0300;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Titillium Web',sans-serif;min-height:100vh}

header{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#101012,#0b0b0c)}
.head-in{max-width:min(96vw,1040px);margin:0 auto;padding:18px 16px 14px;display:flex;align-items:center;gap:14px}
.slash{width:26px;height:34px;background:var(--red);transform:skewX(-18deg);flex:none}
.brand{font-style:italic;font-weight:900;font-size:20px;letter-spacing:.06em;text-transform:uppercase;line-height:1.05}
.brand small{display:block;font-style:normal;font-weight:600;font-size:10px;letter-spacing:.3em;color:var(--dim)}
.uarea{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim)}
.uarea a{color:var(--dim);cursor:pointer;text-decoration:none;border:1px solid var(--line);padding:4px 10px}
.uarea a:hover{color:var(--ink);border-color:var(--red)}

nav#crumb{max-width:min(96vw,1040px);margin:0 auto;padding:14px 16px 0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap}
nav#crumb a{color:var(--dim);text-decoration:none}
nav#crumb a:hover{color:var(--ink)}
nav#crumb .sep{color:var(--red)}
nav#crumb .cur{color:var(--ink)}

main{max-width:min(96vw,1040px);margin:0 auto;padding:14px 16px 60px}
h2.vt{font-style:italic;font-weight:900;text-transform:uppercase;font-size:26px;letter-spacing:.04em;margin:10px 0 16px}
h2.vt em{color:var(--red);font-style:italic}

.row{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--red-dark);padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.row:hover{border-left-color:var(--red);background:var(--panel2)}
.row .name{font-weight:600;font-size:16px;flex:1}
.row .meta{font-family:'Chivo Mono',monospace;font-size:12px;color:var(--dim);text-align:right}
.row .arrow{color:var(--red);font-weight:900}

.acc{margin-bottom:8px}
.acc .row{margin-bottom:0}
.acc.open .row{border-left-color:var(--red)}
.sess{display:none;border:1px solid var(--line);border-top:0;background:#0e0e10}
.acc.open .sess{display:block}
.sess a{display:flex;gap:14px;align-items:center;padding:11px 16px 11px 34px;color:var(--ink);text-decoration:none;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.sess a:hover{background:var(--panel2)}
.sess .stype{font-weight:600;text-transform:uppercase;font-size:12px;letter-spacing:.08em;min-width:110px}
.sess .stype.race{color:var(--red)}
.sess .sdate{color:var(--dim);flex:1}
.sess .smeta{font-family:'Chivo Mono',monospace;font-size:12px;color:var(--dim)}
.wxline{display:block;font-size:11px;color:var(--dim);margin-top:2px}

.delx{flex:none;background:transparent;border:1px solid var(--line);color:var(--dim);width:26px;height:26px;line-height:1;font-size:13px;cursor:pointer;opacity:.5;transition:opacity .15s,border-color .15s,color .15s}
.row:hover .delx, .sessrow:hover .delx{opacity:1}
.delx:hover{border-color:var(--red);color:var(--red);opacity:1}

.modalwrap{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modalcard{max-width:380px;width:100%;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--red);padding:22px}
.modalcard h3{font-style:italic;font-weight:900;text-transform:uppercase;font-size:17px;margin-bottom:10px}
.modalcard p{font-size:13px;color:var(--dim);line-height:1.5;margin-bottom:18px}
.modalbtns{display:flex;gap:10px}
.modalbtns .btn{margin-top:0}

.board{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--red);padding:20px;margin-bottom:16px}
.board .lbl{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
.board .big{font-family:'Chivo Mono',monospace;font-weight:700;font-size:clamp(38px,9vw,56px);line-height:1.1;font-variant-numeric:tabular-nums}
.board .ctx{margin-top:6px;font-size:13px;color:var(--dim)}

.wx{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 16px}
.chip{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--red);padding:10px 14px;min-width:86px}
.chip .ico{font-size:18px;line-height:1}
.chip .cl{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.chip .cv{font-family:'Chivo Mono',monospace;font-size:13px;font-weight:700}

.stint{margin-bottom:18px}
.sthead{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--red);padding:11px 14px;cursor:pointer;flex-wrap:wrap}
.sthead:hover{background:#1d1d21}
.stnum{font-style:italic;font-weight:900;text-transform:uppercase;font-size:13px;letter-spacing:.08em;color:var(--red)}
.stname{font-weight:600;flex:1}
.stmeta{font-family:'Chivo Mono',monospace;font-size:12px;color:var(--dim)}
.setupbox{display:none;border:1px solid var(--line);border-top:0;background:#0e0e10;padding:14px 16px}
.setupbox.open{display:block}
.setupbox h4{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin:10px 0 6px}
.setupbox h5{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:8px 0 4px}
.kv{display:flex;justify-content:space-between;font-family:'Chivo Mono',monospace;font-size:12px;padding:3px 0;border-bottom:1px dashed #1c1c20}
.kvgrid{margin-bottom:4px}

.setuptabs{margin-top:2px}
.tabsrow{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.tabarrow{flex:none;background:var(--panel2);border:1px solid var(--line);color:var(--dim);width:28px;height:28px;font-size:16px;line-height:1;cursor:pointer}
.tabarrow:hover{border-color:var(--red);color:var(--ink)}
.tabstrip{flex:1;display:flex;gap:4px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none}
.tabstrip::-webkit-scrollbar{display:none}
.tabbtn{flex:none;background:var(--panel2);border:1px solid var(--line);color:var(--dim);padding:7px 14px;font-family:'Titillium Web';font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.tabbtn:hover{color:var(--ink)}
.tabbtn.active{border-color:var(--red);color:#fff;background:linear-gradient(180deg,#1d1214,#18181b)}
.tabpane{display:none}
.tabpane.active{display:block}
.blockgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.setblock{background:#0e0e10;border:1px solid var(--line);padding:10px 12px}

tr.clk{cursor:pointer}
tr.clk:hover td{background:rgba(225,6,0,.12)}
.graphcol{text-align:right;width:28px}
.telwrap{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:720px){.telwrap{grid-template-columns:minmax(320px,38%) 1fr;align-items:start}}

.telmap{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--red);padding:8px}
.telmap canvas{display:block;touch-action:none}
.telgraphs{display:flex;flex-direction:column;gap:8px}
.telg{position:relative;background:var(--panel);border:1px solid var(--line);padding:14px 8px 4px}
.telglabel{position:absolute;top:4px;left:10px;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.telg canvas{display:block}
.telhint{margin-top:12px;font-size:12px;color:var(--dim)}
.pwbar{display:flex;justify-content:flex-end;margin-bottom:10px}
.pwbtn{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-top:2px solid var(--red);color:var(--ink);padding:8px 16px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.pwbtn:hover{border-color:var(--red);color:var(--red)}
.pwsel{display:flex;gap:10px;flex-wrap:wrap;padding-top:12px}
.pwsel select{flex:1;min-width:180px}
.pwgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;padding-top:12px}
.pwgrid label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.pwgrid input,.pwgrid select{font-family:'Chivo Mono',monospace;font-weight:700}
.pwrow2{display:flex;gap:6px}
.pwsrc{font-size:10px;color:var(--dim);text-transform:none;letter-spacing:0;font-style:italic}
.pwtab{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
.pwtab th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:6px 8px;border-bottom:1px solid var(--line)}
.pwtab td{padding:8px;border-bottom:1px solid #1c1c20}
.pwnum{font-family:'Chivo Mono',monospace}
.pwbest{background:rgba(225,6,0,.12)}
.pwbest td{font-weight:700}
.pwno td{color:var(--dim);font-style:italic}
.pwnote{margin-top:12px;font-size:13px;border-left:3px solid var(--red);padding-left:12px}
.lvwrap{display:grid;grid-template-columns:1fr;gap:12px}
.hud{background:var(--bg);border-bottom:2px solid var(--red);
     display:grid;grid-template-columns:1fr;gap:12px;padding:10px 0 12px;margin-bottom:4px}
@media(min-width:820px){.hud{grid-template-columns:1fr 280px}}
.hudmap{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--red);padding:8px;position:relative}
.hudside{display:flex;flex-direction:column;gap:10px}
.hudmeteo{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--panel);border:1px solid var(--line);padding:10px}
.mtitem{display:flex;flex-direction:column;gap:2px}
.mtitem span{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.mtitem b{font-family:'Chivo Mono',monospace;font-size:13px}
.ghost{background:var(--panel);border:1px solid var(--line);border-top:2px solid #fff;padding:10px;flex:1}
.ghhead{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.ghpos{font-family:'Chivo Mono',monospace;font-size:28px;font-weight:700;line-height:1.1}
.ghpos span{font-size:11px;color:var(--dim);font-weight:400}
.ghtra{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.5}
.ghnote{font-size:9px;color:var(--dim);margin-top:6px;font-style:italic}
.tabsub{margin-top:8px}
.lvghost{position:absolute;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:16px}
.lvcar.ev{outline:2px solid #fff;z-index:4}
.tim{font-size:12px}
.tim th{white-space:nowrap}
.tim td{padding:6px 8px;white-space:nowrap}
.clsdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.cpos{font-size:9px;color:var(--dim);margin-left:4px;vertical-align:super}
.tim .best{color:#c07bff}
.tim .cls{font-size:10px;color:var(--dim)}
.tim .cl{color:var(--dim)}
.lvname{cursor:pointer;border-bottom:1px dotted var(--line)}
.lvname:hover{color:var(--red)}
.lvsel{outline:1px solid rgba(255,255,255,.25)}
.lvchk{accent-color:var(--red);width:14px;height:14px;cursor:pointer}
.pitnow{color:#f2b63d}
.okv{color:#35d07f}
.kov{color:var(--red)}
.mtbig{display:flex;flex-direction:column;gap:3px}
.mtbig span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.mtbig b{font-family:'Chivo Mono',monospace;font-size:20px}
.stpick{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px}
.stchip{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);padding:6px 10px;font-size:12px;cursor:pointer}
.stchip.on{border-color:var(--red)}
.stchip input{accent-color:var(--red);width:13px;height:13px}
.stchip i{font-style:normal;font-size:10px;color:var(--dim)}
.strow{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding-top:12px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.strow label{display:flex;align-items:center;gap:6px}
.txtin.small{width:80px;padding:6px 8px}
#stchart{display:block;width:100%;margin-top:10px}
.stleg{display:inline-flex;align-items:center;gap:5px;margin-right:14px}
.stleg i{width:10px;height:3px;display:inline-block}
.stnota{font-style:italic}
.sttab{margin-top:8px}
.barrastrum{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 4px}
.colmenu{min-width:240px}
.colrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 10px;font-size:13px}
.colrow:hover{background:var(--panel2)}
.colrow label{display:flex;align-items:center;gap:8px;cursor:pointer;flex:1}
.colrow input{accent-color:var(--red);width:15px;height:15px}
.colmove{display:flex;gap:2px}
.colmove button{background:transparent;border:1px solid var(--line);color:var(--dim);width:20px;height:20px;font-size:9px;cursor:pointer;padding:0}
.colmove button:hover:not(:disabled){border-color:var(--red);color:var(--red)}
.colmove button:disabled{opacity:.25;cursor:default}
th[draggable]{cursor:grab}
th.ordina{cursor:pointer;user-select:none}
th.ordina:hover{color:var(--ink)}
th.ordinata{color:var(--red)}
th.trascino{opacity:.4}
th.sopra{box-shadow:inset 3px 0 0 var(--red)}
.chanbtn.inpausa{border-color:#f2b63d;color:#f2b63d}
.chartbox{height:300px;margin-top:10px}
.tabbox{margin-top:6px}
#stchart{display:block;width:100%;height:100%}
.ridim{resize:vertical;overflow:auto;position:relative}
.ridim::-webkit-resizer{background:var(--panel2)}
.ridim::after{content:"";position:absolute;right:2px;bottom:2px;width:10px;height:10px;
  border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);opacity:.5;pointer-events:none}
@media(min-width:820px){.lvwrap{grid-template-columns:1fr 300px}}
#lvmap{display:block;width:100%;margin-top:10px}
.lvdot{color:var(--red);font-size:10px;margin-left:10px;text-transform:none;letter-spacing:0}
.lvbar{position:relative;height:54px;margin-top:12px;background:#0e0e10;border:1px solid var(--line);border-left:3px solid #fff}
.lvcar{position:absolute;top:50%;transform:translate(-50%,-50%);background:#c9c9d1;color:#0b0b0c;font-family:'Chivo Mono',monospace;font-size:10px;font-weight:700;padding:2px 4px;border-radius:2px}
.lvcar.io{background:var(--red);color:#fff;z-index:3}
.lvcar.box{background:#f2b63d}
.lvme{display:flex;flex-direction:column;gap:8px;padding-top:12px}
.lvme div{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;border-bottom:1px dashed #1c1c20;padding-bottom:6px}
.lvme span{color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.lvme b{font-family:'Chivo Mono',monospace;font-size:14px}
.lvnum{display:inline-block;background:var(--panel2);border:1px solid var(--line);font-family:'Chivo Mono',monospace;font-size:10px;padding:1px 5px;margin-right:7px}
.lvme-row{background:rgba(225,6,0,.12)}
.lvme-row td{font-weight:700}
.lvpit td{color:#f2b63d}
.lvtag{font-size:9px;background:#f2b63d;color:#0b0b0c;padding:1px 4px;margin-left:6px;letter-spacing:.06em}
#backbar{max-width:min(96vw,1040px);margin:0 auto;padding:14px 16px 0}
#backbar:empty{padding:0}
.backbtn{display:inline-block;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:7px 14px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;text-decoration:none}
.backbtn:hover{border-color:var(--red);color:var(--red)}
.tabbar{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabbtn{background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);padding:10px 18px;font-family:'Titillium Web';font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.tabbtn:hover{color:var(--ink)}
.tabbtn.on{color:var(--ink);border-bottom-color:var(--red)}
.plotcard{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--red);padding:14px}
.plothead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.plottitle{font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.plotlegend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--dim)}
.plotlegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:8px}
.plotlegend i.lseg{width:14px;height:0;border-top:2px solid var(--dim);border-radius:0}
.plotlegend i.lseg.dash{border-top-style:dashed}
#gripcv{display:block;width:100%}
.plotna{padding:40px 10px;text-align:center;color:var(--dim);font-size:13px}
.plotctrl{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.ctrlrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px}
.ctrlrow label{color:var(--dim);letter-spacing:.06em;text-transform:uppercase;font-size:11px;min-width:150px}
.ctrlrow input[type=range]{flex:1;min-width:140px;accent-color:var(--red)}
.ctrlval{font-family:'Chivo Mono',monospace;font-weight:700;min-width:44px}
.ptcount{font-family:'Chivo Mono',monospace;font-size:11px;color:var(--dim)}
.presets{display:flex;gap:6px}
.preset.on{border-color:var(--red);color:var(--red)}
.txtin{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:10px 12px;font-family:'Titillium Web';font-size:14px}
.txtin:focus{outline:none;border-color:var(--red)}
.txtin::placeholder{color:var(--dim)}
.switchrow{display:flex;align-items:center;gap:10px;padding:12px 0 4px;cursor:pointer;font-size:14px}
.switchrow input{accent-color:var(--red);width:18px;height:18px;cursor:pointer}
.warnbox{font-size:12px;color:var(--dim);line-height:1.6;border-left:3px solid var(--red);padding:8px 0 8px 12px;margin-top:8px}
.trow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:none}
.tname{font-weight:600;font-size:14px;color:var(--ink);text-decoration:none}
a.tname:hover{color:var(--red)}
.tmeta{font-size:12px;color:var(--dim);flex:1}
.tag{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.pend{color:var(--red)}
.btn.small{padding:6px 12px;font-size:12px;margin-top:0;width:auto}
.robadge{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line);padding:4px 10px;margin-bottom:12px}
.telbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
#addlapbtn:disabled{opacity:.5;cursor:not-allowed}
.lapchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.lapchip{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);padding:5px 8px 5px 6px;font-size:12px}
.lapchip .lapcolor{width:20px;height:20px;border:none;background:none;padding:0;cursor:pointer}
.lapchip .lapcolor:disabled{cursor:default}
.lapchiplbl{color:var(--ink)}
.lapx{background:transparent;border:none;color:var(--dim);cursor:pointer;font-size:12px;padding:0 2px}
.lapx:hover{color:var(--red)}
.picklist{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;margin-bottom:16px}
.pickrow{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:#0e0e10;border:1px solid var(--line);padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.pickrow:hover{border-color:var(--red)}
.pkmain{font-weight:600;font-size:13px;color:var(--ink)}
.pksub{font-family:'Chivo Mono',monospace;font-size:11px;color:var(--dim)}
.chansel{position:relative;margin-bottom:12px}
.chanbtn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:8px 14px;font-family:'Titillium Web';font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}

/* ---------- Riquadri ridimensionabili ---------- */
// L'utente trascina l'angolo in basso a destra; la misura resta memorizzata nel suo browser.
let dimensioni = {};
try { dimensioni = JSON.parse(localStorage.getItem("dimensioni") || "{}"); } catch(e){}
let _salvaDimTimer = null;
function salvaDimensioni(){
  clearTimeout(_salvaDimTimer);
  _salvaDimTimer = setTimeout(() => {
    try { localStorage.setItem("dimensioni", JSON.stringify(dimensioni)); } catch(e){}
  }, 400);
}
function ridimensionabile(el, chiave, alRidimensiona){
  if (!el) return;
  el.classList.add("ridim");
  const salvata = dimensioni[chiave];
  if (salvata && salvata > 40) el.style.height = salvata + "px";
  if (el.dataset.ridim === chiave) return;      // osservatore già attivo
  el.dataset.ridim = chiave;
  if (typeof ResizeObserver === "undefined") return;
  let ultima = el.offsetHeight;
  const ro = new ResizeObserver(() => {
    const h = Math.round(el.offsetHeight);
    if (Math.abs(h - ultima) < 2) return;
    ultima = h;
    dimensioni[chiave] = h;
    salvaDimensioni();
    if (alRidimensiona) alRidimensiona(h);
  });
  ro.observe(el);
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function confirmModal(title, body, okLabel, danger){
  return new Promise(resolve => {
    const wrap = document.createElement("div");
    wrap.className = "modalwrap";
    wrap.innerHTML = `<div class="modalcard">
      <h3>${esc(title)}</h3>
      <p>${esc(body)}</p>
      <div class="modalbtns">
        <button class="btn ghost" id="mcancel">Annulla</button>
        <button class="btn${danger===false?" safe":""}" id="mok">${esc(okLabel || "Cancella")}</button>
      </div></div>`;
    document.body.appendChild(wrap);
    const close = v => { wrap.remove(); resolve(v); };
    wrap.addEventListener("click", e => { if (e.target === wrap) close(false); });
    wrap.querySelector("#mcancel").onclick = () => close(false);
    wrap.querySelector("#mok").onclick = () => close(true);
  });
}
const fmt = s => { const m = Math.floor(s/60); return `${m}:${(s-m*60).toFixed(3).padStart(6,"0")}`; };
const fdate = iso => new Date(iso).toLocaleString("it-IT",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
const stype = t => {
  t = (t||"").toLowerCase();
  if (t.includes("race")) return "Gara";
  if (t.includes("qual")) return "Qualifica";
  if (t.includes("practice") || t.includes("warmup")) return "Prove libere";
  if (t.includes("test")) return "Test";
  return t || "Sessione";
};
const compass = r => r==null ? "" : ["N","NE","E","SE","S","SO","O","NO"][Math.round(((r*180/Math.PI)%360+360)%360/45)%8];
const usageIt = u => {
  u = (u||"").toLowerCase();
  if (u.includes("moderately low")) return "Medio-basso";
  if (u.includes("moderately high")) return "Medio-alto";
  if (u.includes("low")) return "Basso";
  if (u.includes("high")) return "Alto";
  if (u.includes("moderate")) return "Medio";
  return u || null;
};
const wxChips = s => {
  const c = [];
  if (s.air_temp != null)   c.push(["🌡️","Aria", s.air_temp.toFixed(1)+"°C"]);
  if (s.track_temp != null) c.push(["🛣️","Pista", s.track_temp.toFixed(1)+"°C"]);
  if (s.humidity != null)   c.push(["💧","Umidità", Math.round(s.humidity*100)+"%"]);
  if (s.wind_vel != null)   c.push(["💨","Vento", (s.wind_vel*3.6).toFixed(0)+" km/h "+compass(s.wind_dir)]);
  if (usageIt(s.track_usage)) c.push(["🏁","Gommatura", usageIt(s.track_usage)]);
  return c;
};
const wxInline = s => wxChips(s).map(([e,,v])=>`${e} ${v}`).join(" · ");

async function api(p, opts={}){
  const tok = await auth.currentUser.getIdToken();
  const r = await fetch(`/api/${p}`, {...opts, headers: {"Authorization": "Bearer "+tok, "Content-Type": "application/json", ...(opts.headers||{})}});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

    ${teams.length ? teams.map(t=>`<div class="row" onclick="location.hash='#/team/${t.id}'">
        <div class="name">${esc(t.name)}</div>
        <div class="meta">${t.members} membr${t.members==1?"o":"i"}${t.is_manager?" · manager":""}${t.is_manager&&t.pending?` · ${t.pending} richieste`:""}</div>

        <input id="tq" class="txtin" placeholder="Nome del team da cercare">
        <div id="tres" style="margin-top:10px"></div>
      </div>
    </div>`;

  document.getElementById("tcreate").onclick = async () => {
    if (!await ensurePilotName()) return;
    const v = document.getElementById("tnew").value.trim();
    if (!v) return alert("Scrivi il nome del team.");
    try { const t = await api("teams",{method:"POST",body:JSON.stringify({name:v})}); location.hash = "#/team/"+t.id; }
    catch(e){ alert("Creazione non riuscita."); }
  };
  const q = document.getElementById("tq"), res = document.getElementById("tres");
  let tmr;
  const search = async () => {
    const list = await api("teams/search?q="+encodeURIComponent(q.value.trim())).catch(()=>[]);
    res.innerHTML = list.length ? list.map(t=>`<div class="trow">
        <span class="tname">${esc(t.name)}</span>
        <span class="tmeta">${t.members} membr${t.members==1?"o":"i"}${t.manager?" · manager: "+esc(t.manager):""}</span>
        ${t.is_member ? `<span class="tag">già dentro</span>`
          : t.pending ? `<span class="tag">richiesta inviata</span>`
          : `<button class="btn small" data-join="${t.id}">Chiedi di entrare</button>`}

    res.querySelectorAll("[data-join]").forEach(b => b.onclick = async () => {

      try { await api(`teams/${b.dataset.join}/request`,{method:"POST",body:"{}"}); search(); }
      catch(e){ alert("Richiesta non riuscita."); }
    });
  };
  q.oninput = () => { clearTimeout(tmr); tmr = setTimeout(search, 250); };
  search();
}

/* ---------- PITWALL: calcolatore di strategia ---------- */
// Modello: il tempo di ogni giro dipende da quanta benzina hai a bordo (peso) e da quanto
// sono vecchie le gomme (degrado). Ogni sosta costa tempo. Confrontare N soste significa
// pesare "meno soste ma auto pesante e gomme vecchie" contro "più soste ma auto leggera".
function simulaStrategia(nSoste, giriTot, p, cfg){
  const nStint = nSoste + 1;
  const base = Math.floor(giriTot / nStint), resto = giriTot % nStint;
  const lung = [];
  for (let i = 0; i < nStint; i++) lung.push(base + (i < resto ? 1 : 0));
  if (lung.some(L => L < 1)) return null;

  let totale = 0; const stint = [];
  let etaGomme = 0;                       // se non si cambiano, l'età prosegue
  for (let si = 0; si < nStint; si++){
    const L = lung[si];
    const carb = L * p.fuel_per_lap + cfg.riserva;
    if (carb > cfg.serbatoio) return {impossibile: true, carb: +carb.toFixed(1)};
    if (cfg.cambiaGomme) etaGomme = 0;
    let f = carb;
    for (let i = 0; i < L; i++){
      totale += p.base_time + p.k_fuel * f + p.deg * etaGomme;
      f -= p.fuel_per_lap;
      etaGomme++;
    }
    stint.push({giri: L, carb: +carb.toFixed(1)});
  }
  for (let i = 0; i < nSoste; i++){
    const litri = lung[i + 1] * p.fuel_per_lap + cfg.riserva;
    const servizio = Math.max(litri / cfg.portata, cfg.cambiaGomme ? cfg.tempoGomme : 0);
    totale += cfg.perditaBox + servizio;
  }
  return {totale, stint};
}

/* ---------- Tabelle configurabili: colonne, ordine, ordinamento ---------- */
// Un unico meccanismo usato da tutte le tabelle: quali colonne mostrare, in che ordine
// (trascinando l'intestazione oppure con le frecce, che funzionano anche da telefono) e con
// quale ordinamento. Tutto viene ricordato nel browser, separatamente per ogni tabella.
const TAB = {
  stato(chiave, colonne){
    let s = null;
    try { s = JSON.parse(localStorage.getItem("tab_" + chiave) || "null"); } catch(e){}
    const chiavi = colonne.map(c => c.k);
    if (!s) s = {};
    // ordine: parto da quello salvato, aggiungo le colonne nuove e tolgo quelle sparite
    let ordine = (s.ordine || []).filter(k => chiavi.includes(k));
    chiavi.forEach(k => { if (!ordine.includes(k)) ordine.push(k); });
    const nascoste = new Set((s.nascoste || []).filter(k => chiavi.includes(k)));
    return {ordine, nascoste, sort: s.sort || null};
  },
  salva(chiave, st){
    try {
      localStorage.setItem("tab_" + chiave, JSON.stringify(
        {ordine: st.ordine, nascoste: [...st.nascoste], sort: st.sort}));
    } catch(e){}
  },
  attive(st, colonne){
    return st.ordine.map(k => colonne.find(c => c.k === k))
                    .filter(c => c && (c.fisso || !st.nascoste.has(c.k)));
  },
  // Intestazione con maniglia di trascinamento e freccia dell'ordinamento
  th(c, st){
    const dir = st.sort && st.sort.k === c.k ? st.sort.dir : 0;
    const freccia = dir === 1 ? " ▲" : dir === -1 ? " ▼" : "";
    return `<th draggable="true" data-col="${c.k}" class="${c.ord?"ordina":""} ${dir?"ordinata":""}"
      title="${c.ord?"Clicca per ordinare · trascina per spostare":"Trascina per spostare"}">${esc(c.t)}${freccia}</th>`;
  },
  menu(st, colonne, chiave){
    const opz = st.ordine.map(k => colonne.find(c => c.k === k)).filter(Boolean);
    const nascoste = opz.filter(c => !c.fisso && st.nascoste.has(c.k)).length;
    return `<div class="chansel">
      <button class="chanbtn" id="colbtn_${chiave}">Colonne <span>(${opz.length-nascoste}/${opz.length})</span> ▾</button>
      <div class="chanmenu colmenu" id="colmenu_${chiave}" hidden>
        ${opz.map((c,i)=>`<div class="colrow">
          <label><input type="checkbox" data-vis="${c.k}" ${c.fisso?"disabled":""}
            ${c.fisso||!st.nascoste.has(c.k)?"checked":""}><span>${esc(c.t||"—")}</span></label>
          <span class="colmove">
            <button data-su="${c.k}" ${i===0?"disabled":""}>▲</button>
            <button data-giu="${c.k}" ${i===opz.length-1?"disabled":""}>▼</button>
          </span></div>`).join("")}
        <button class="btn small ghost" id="colreset_${chiave}" style="margin:8px 6px 4px">Ripristina ordine</button>
      </div></div>`;
  },
  // Collega tutti i comportamenti: menu, frecce, trascinamento, click di ordinamento
  attiva(root, chiave, colonne, st, ridisegna){
    const btn = root.querySelector("#colbtn_" + chiave);
    const menu = root.querySelector("#colmenu_" + chiave);
    if (btn && menu){
      btn.onclick = () => { menu.hidden = !menu.hidden; };
      menu.querySelectorAll("[data-vis]").forEach(k => k.onchange = () => {
        if (k.checked) st.nascoste.delete(k.dataset.vis); else st.nascoste.add(k.dataset.vis);
        TAB.salva(chiave, st); ridisegna();
      });
      const sposta = (k, delta) => {
        const i = st.ordine.indexOf(k), j = i + delta;
        if (i < 0 || j < 0 || j >= st.ordine.length) return;
        st.ordine.splice(j, 0, st.ordine.splice(i, 1)[0]);
        TAB.salva(chiave, st); ridisegna();
      };
      menu.querySelectorAll("[data-su]").forEach(b => b.onclick = () => sposta(b.dataset.su, -1));
      menu.querySelectorAll("[data-giu]").forEach(b => b.onclick = () => sposta(b.dataset.giu, 1));
      const rs = root.querySelector("#colreset_" + chiave);
      if (rs) rs.onclick = () => {
        st.ordine = colonne.map(c=>c.k); st.nascoste = new Set(); st.sort = null;
        TAB.salva(chiave, st); ridisegna();
      };
    }
    // ordinamento al click sull'intestazione
    root.querySelectorAll("th[data-col]").forEach(th => {
      const c = colonne.find(x => x.k === th.dataset.col);
      if (c && c.ord) th.onclick = e => {
        if (th.dataset.trascinato) { delete th.dataset.trascinato; return; }
        const cur = st.sort && st.sort.k === c.k ? st.sort.dir : 0;
        st.sort = cur === 1 ? {k:c.k, dir:-1} : cur === -1 ? null : {k:c.k, dir:1};
        TAB.salva(chiave, st); ridisegna();
      };
      // trascinamento per riordinare
      th.ondragstart = e => { e.dataTransfer.setData("text/plain", th.dataset.col); th.classList.add("trascino"); };
      th.ondragend = () => th.classList.remove("trascino");
      th.ondragover = e => { e.preventDefault(); th.classList.add("sopra"); };
      th.ondragleave = () => th.classList.remove("sopra");
      th.ondrop = e => {
        e.preventDefault(); th.classList.remove("sopra");
        const da = e.dataTransfer.getData("text/plain"), a = th.dataset.col;
        if (!da || da === a) return;
        const i = st.ordine.indexOf(da), j = st.ordine.indexOf(a);
        if (i < 0 || j < 0) return;
        st.ordine.splice(j, 0, st.ordine.splice(i, 1)[0]);
        th.dataset.trascinato = "1";
        TAB.salva(chiave, st); ridisegna();
      };
    });
  },
  // Applica l'ordinamento scelto a un elenco di righe
  ordina(righe, st, colonne){
    if (!st.sort) return righe;
    const c = colonne.find(x => x.k === st.sort.k);
    if (!c || !c.ord) return righe;
    const v = r => { const x = c.ord(r); return (x == null || Number.isNaN(x)) ? null : x; };
    return righe.slice().sort((a,b) => {
      const va = v(a), vb = v(b);
      // I valori mancanti restano SEMPRE in fondo, anche invertendo l'ordine
      if (va == null && vb == null) return 0;
      if (va == null) return 1;
      if (vb == null) return -1;
      if (typeof va === "string" || typeof vb === "string")
        return String(va).localeCompare(String(vb)) * st.sort.dir;
      return (va - vb) * st.sort.dir;
    });
  }
};

/* ---------- Ricostruzione della forma del tracciato (usata da telemetria e Pitwall) ---------- */
function ricostruisciTracciato(l){
  // iRacing non fornisce le coordinate GPS (verificato: non esistono fra le 354 variabili).
  // Fornisce però velocità e direzione, e da quelle la traiettoria si ricava per integrazione.
  // Tre metodi in ordine di precisione: il primo usa la direzione MISURATA rispetto al nord,
  // quindi non accumula errore di rotazione.
  const ch = l.ch, n = (ch.lapdist || []).length;
  if (!n || !l.time_s) return null;
  const dt = l.time_s / n;
  const X = [], Y = [];
  let x = 0, y = 0;

  if (ch.velx && ch.vely && ch.yaw && ch.yaw.some(v => v != null)){
    // METODO MIGLIORE: velocità dell'auto ruotata secondo la direzione assoluta.
    // ATTENZIONE alla convenzione: YawNorth è una BUSSOLA (l'angolo cresce in senso orario
    // partendo da nord), non un angolo matematico (antiorario da est). Trattarlo come
    // matematico produceva una mappa SPECCHIATA: chi andava a nord si spostava a destra.
    // Con la bussola: direzione di marcia = (sin, cos) su (est, nord).
    for (let i=0;i<n;i++){
      const vx = ch.velx[i], vy = ch.vely[i], a = ch.yaw[i];
      if (vx != null && vy != null && a != null){
        x += (vx * Math.sin(a) + vy * Math.cos(a)) * dt;   // est
        y += (vx * Math.cos(a) - vy * Math.sin(a)) * dt;   // nord
      }
      X.push(x); Y.push(y);
    }
  } else {
    // RIPIEGO: direzione ricavata dalla rotazione o dall'accelerazione laterale
    const sp = ch.speed, la = ch.lataccel, yr = ch.yawrate;
    if (!sp) return null;
    const usaYaw = yr && yr.some(v => v != null && Math.abs(v) > 1e-4);
    if (!usaYaw && !la) return null;
    let psi = 0;
    for (let i=0;i<n;i++){
      const v = sp[i];
      if (v != null && v > 1){
        // stessa convenzione a bussola: psi cresce in senso orario partendo da nord
        psi += usaYaw && yr[i] != null ? -yr[i] * dt : -((la[i] != null ? la[i] : 0) / v) * dt;
        x += Math.sin(psi) * v * dt;   // est
        y += Math.cos(psi) * v * dt;   // nord
      }
      X.push(x); Y.push(y);
    }
  }
  // il giro è chiuso: distribuisco lungo il percorso il piccolo errore di chiusura
  const ex = X[n-1]-X[0], ey = Y[n-1]-Y[0];
  for (let i=0;i<n;i++){ const f = i/(n-1); X[i] -= ex*f; Y[i] -= ey*f; }
  if (Math.max(...X)-Math.min(...X) < 1e-6) return null;
  return {lat: Y, lon: X, ricostruito: true};
}

let lvTab = "timing";
let liveInPausa = false;   // congela l'aggiornamento per leggere con calma

let ultimoGiroVisto = null;     // per capire quando serve davvero rifare le schede lente

async function aggiornaLive(forzato){
  const body = document.getElementById("lvbody");
  if (!body) { fermaLive(); return; }
  // Se l'utente sta interagendo, l'aggiornamento aspetta: un secondo di ritardo non cambia
  // nulla, ma evita che menu e trascinamenti vengano interrotti.
  if (!forzato && interazioneInCorso()) return;
  const mio = chiSonoIo(livePilot);
  let d;
  try { d = await api("live" + (mio ? "" : `?pilot=${encodeURIComponent(livePilot)}`)); }
  catch(e){ body.innerHTML = `<div class="err">Impossibile leggere lo stato dal vivo.</div>`; return; }
  const hud = document.getElementById("hud");
  if (!d.attivo){
    if (hud) hud.style.display = "none";
    body.innerHTML = `<div class="board"><div class="ctx">Sessione non attiva</div>
      <p class="warnbox">${esc(d.motivo || "nessun dato")}${d.fermo_da?` · fermo da ${d.fermo_da} s`:""}</p></div>`;
    return;
  }
  if (hud) hud.style.display = "";

  const S = d.sessione || {}, cars = d.cars || [], der = d.derivati || {};
  const nomi = {}; (d.piloti||[]).forEach(p => nomi[p.i] = p);
  if (S.pista && liveTrack !== S.pista){
    liveTrack = S.pista;
    const grezzo = await api(`track-outline?name=${encodeURIComponent(S.pista)}`
      + (mio?"":`&pilot=${encodeURIComponent(livePilot)}`)).catch(()=>({disponibile:false}));
    // La forma si ricostruisce qui con la STESSA funzione della telemetria: una sola matematica,
    // gia' verificata, invece di due versioni che rischiano di divergere.
    liveOutline = {disponibile:false};
    if (grezzo && grezzo.disponibile && grezzo.canali){
      const c = grezzo.canali;
      const geo = ricostruisciTracciato({ch:c, n:(c.lapdist||[]).length, time_s:grezzo.time_s});
      if (geo && geo.lat && geo.lat.length > 20)
        liveOutline = {disponibile:true,
          punti: geo.lat.map((la,i)=>({d:c.lapdist[i], lat:la, lon:geo.lon[i]}))};
    }
    // Cerco nell'archivio i parametri misurati per QUESTA auto su QUESTA pista: servono alla
    // Ghost Car e alla strategia. L'auto e la pista arrivano come nomi, quindi li abbino così.
    liveParams = null;
    try {
      const cars = await api("cars" + (mio?"":`?pilot=${encodeURIComponent(livePilot)}`));
      const auto = cars.find(c => S.auto && c.name.toLowerCase() === S.auto.toLowerCase()) || cars[0];
      if (auto){
        const trs = await api(`cars/${auto.id}/tracks` + (mio?"":`?pilot=${encodeURIComponent(livePilot)}`));
        const tr = trs.find(t => t.name.toLowerCase() === S.pista.toLowerCase());
        if (tr) liveParams = await api(`strategy/params?car_id=${auto.id}&track_id=${tr.id}`);
      }
    } catch(e){}
  }
  const ordinate = cars.slice().sort((a,b)=>(a.p||99)-(b.p||99));
  disegnaHUD(d, ordinate, nomi, der, S);

  liveDati = d; liveT0 = performance.now();
  if (!rafId) avviaRaf();

  // Ritmi diversi: la classifica ogni secondo, le schede lente solo quando finisce un giro.
  const firmaGiri = (d.cars||[]).map(c=>c.l).join(",");
  const giroCambiato = firmaGiri !== ultimoGiroVisto;
  ultimoGiroVisto = firmaGiri;

  if (lvTab === "timing") renderTiming(body, d, ordinate, nomi, der);
  else if (lvTab === "strategia"){ if (giroCambiato || forzato || !body.dataset.pronta){ renderStrategia(body, d, ordinate, der); body.dataset.pronta="1"; } }
  else if (lvTab === "meteo") renderMeteo(body, S);
  else { if (giroCambiato || forzato || !body.dataset.pronta){ renderStorico(body, d, ordinate, nomi, der); body.dataset.pronta="1"; } }
}

/* ---- Torre di controllo: minimappa, meteo, ghost car ---- */
function disegnaHUD(d, ordinate, nomi, der, S){
  const me = d.me;
  // meteo
  const mt = document.getElementById("hudmeteo");
  const bagn = S.bagnato != null ? ["asciutto","quasi asciutto","umido","bagnato","molto bagnato","allagato"][Math.min(5,Math.max(0,(S.bagnato|0)-1))] : null;
  if (mt) mt.innerHTML = `
    <div class="mtitem"><span>Aria</span><b>${S.airTemp!=null?S.airTemp.toFixed(1)+"°":"—"}</b></div>
    <div class="mtitem"><span>Asfalto</span><b>${S.trackTemp!=null?S.trackTemp.toFixed(1)+"°":"—"}</b></div>
    <div class="mtitem"><span>Pista</span><b>${bagn?esc(bagn):"—"}</b></div>
    <div class="mtitem"><span>Pioggia</span><b>${S.pioggia!=null?Math.round(S.pioggia*100)+"%":"—"}</b></div>
    <div class="mtitem"><span>Vento</span><b>${S.vento!=null?(S.vento*3.6).toFixed(0)+" km/h":"—"} ${S.ventoDir!=null?frecciaVento(S.ventoDir):""}</b></div>
    <div class="mtitem"><span>Resta</span><b>${S.tempoRimasto!=null&&S.tempoRimasto<86400?fmtOre(S.tempoRimasto):(S.giriRimasti!=null&&S.giriRimasti<9999?S.giriRimasti+" giri":"—")}</b></div>`;

  // ghost car: dove rientrerei se mi fermassi adesso
  const g = document.getElementById("ghost");
  const mia = ordinate.find(c=>c.i===me);
  const perdita = (liveParams && liveParams.pit_loss) || 30;
  ghostD = null;
  if (mia && g){
    const tot = c => (c.l||0) + (c.d||0);
    const mioDopo = tot(mia) + 0.02;              // il tratto percorso in corsia box
    let davanti = 0, tra = [];
    ordinate.forEach(c => {
      if (c.i === me) return;
      const suo = tot(c) + (c.lt ? perdita / c.lt : 0);   // avanzano mentre sono fermo
      if (suo > mioDopo) davanti++;
    });
    const posDopo = davanti + 1;
    const vicini = ordinate.filter(c=>c.i!==me)
      .map(c => ({c, t: tot(c) + (c.lt ? perdita / c.lt : 0)}))
      .sort((a,b)=>b.t-a.t);
    const sopra = vicini.filter(v=>v.t>mioDopo).pop();
    const sotto = vicini.filter(v=>v.t<=mioDopo)[0];
    ghostD = (mia.d + 0.02) % 1;
    g.innerHTML = `<div class="ghhead">Se rientro adesso</div>
      <div class="ghpos">P${posDopo}<span>${mia.p&&posDopo>mia.p?` (${posDopo-mia.p} in meno)`:mia.p&&posDopo<mia.p?` (${mia.p-posDopo} in più)`:""}</span></div>
      <div class="ghtra">${sopra?`dietro a <b>${esc((nomi[sopra.c.i]||{}).n||"?")}</b>`:"in testa"}${sotto?`<br>davanti a <b>${esc((nomi[sotto.c.i]||{}).n||"?")}</b>`:""}</div>
      <div class="ghnote">perdita stimata ${perdita.toFixed(0)} s</div>`;
  } else if (g){ g.innerHTML = ""; ghostD = null; }

  ridimensionabile(document.querySelector(".hudmap"), "hud_mappa");
}
const frecciaVento = rad => {
  const dirs = ["↑N","↗NE","→E","↘SE","↓S","↙SO","←O","↖NO"];
  return dirs[Math.round(((rad%(2*Math.PI))/(2*Math.PI))*8)%8];
};
const fmtOre = s => { s=Math.max(0,Math.round(s)); const m=Math.floor(s/60);
  return m>=60?`${Math.floor(m/60)}h${String(m%60).padStart(2,"0")}`:`${m}:${String(s%60).padStart(2,"0")}`; };
const pc = v => v!=null ? Math.round(v*100)+"%" : "—";

function disegnaMappa(cars, nomi, meIdx, ghostD){
  const cv = document.getElementById("lvmap"); if (!cv) return;
  document.getElementById("lvbar").hidden = true; cv.hidden = false;
  const pts = liveOutline.punti;
  const dpr = Math.min(window.devicePixelRatio||1,2);
  const H = Math.max(140, Math.round((cv.parentElement.clientHeight || 276) - 16));
  cv.style.width="100%"; cv.style.height=H+"px";
  cv.width = cv.clientWidth*dpr; cv.height = H*dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr,dpr);
  const w = cv.clientWidth, pad = 20;
  const las=pts.map(p=>p.lat), los=pts.map(p=>p.lon);
  const laMin=Math.min(...las),laMax=Math.max(...las),loMin=Math.min(...los),loMax=Math.max(...los);
  const sc = Math.min((w-2*pad)/((loMax-loMin)||1), (H-2*pad)/((laMax-laMin)||1));
  const cx=w/2, cy=H/2, midLo=(loMin+loMax)/2, midLa=(laMin+laMax)/2;
  const X=lo=>cx+(lo-midLo)*sc, Y=la=>cy-(la-midLa)*sc;
  const at = dd => { let b=pts[0], bd=9; pts.forEach(p=>{const q=Math.abs(p.d-dd); if(q<bd){bd=q;b=p;}}); return b; };
  ctx.clearRect(0,0,w,H);
  ctx.strokeStyle="#3a3a40"; ctx.lineWidth=3; ctx.beginPath();
  pts.forEach((p,i)=> i?ctx.lineTo(X(p.lon),Y(p.lat)):ctx.moveTo(X(p.lon),Y(p.lat)));
  ctx.closePath(); ctx.stroke();
  if (ghostD != null){
    const p = at(ghostD);
    ctx.setLineDash([3,3]); ctx.strokeStyle="#fff"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(X(p.lon),Y(p.lat),9,0,7); ctx.stroke(); ctx.setLineDash([]);
  }
  cars.forEach(c => {
    const p = at(c.d||0), x=X(p.lon), y=Y(p.lat);
    const io = c.i===meIdx, ev = liveSel.includes(c.i);
    ctx.fillStyle = io ? "#fff" : colClasse(c.cl);
    ctx.globalAlpha = c.pit ? .45 : 1;
    ctx.beginPath(); ctx.arc(x,y, io?8:(ev?7:5), 0, 7); ctx.fill(); ctx.globalAlpha=1;
    ctx.strokeStyle = ev ? "#fff" : "#0b0b0c"; ctx.lineWidth = ev?2.5:1.5; ctx.stroke();
    const nm=nomi[c.i]||{};
    if (nm.num && (io||ev)){ ctx.fillStyle="#0b0b0c"; ctx.font="700 8px 'Chivo Mono',monospace";
      ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(String(nm.num),x,y+0.5); ctx.textAlign="start"; }
  });
}
function disegnaBarra(cars, nomi, meIdx, ghostD){
  const cv=document.getElementById("lvmap"), host=document.getElementById("lvbar");
  if (!host) return; cv.hidden=true; host.hidden=false;
  host.innerHTML = cars.map(c=>{
    const nm=nomi[c.i]||{}, io=c.i===meIdx, ev=liveSel.includes(c.i);
    return `<span class="lvcar ${io?"io":""} ${ev?"ev":""} ${c.pit?"box":""}"
      style="left:${((c.d||0)*100).toFixed(2)}%;background:${io?"#fff":colClasse(c.cl)}"
      title="${esc(nm.n||"")}">${esc(String(nm.num||c.i))}</span>`;
  }).join("") + (ghostD!=null?`<span class="lvghost" style="left:${(ghostD*100).toFixed(2)}%">◌</span>`:"");
}



/* ---------- Movimento fluido: previsione fra un aggiornamento e l'altro ----------
   L'agente manda una fotografia della gara una volta al secondo. Disegnare solo quelle
   produce uno scatto ogni secondo. Qui invece si PREVEDE dove si trova ogni auto in ogni
   istante, usando il suo ritmo, e si ridisegna a ogni fotogramma; quando arriva la
   fotografia vera la posizione viene corretta scivolando, non saltando. */
let liveDati = null, liveT0 = 0, rafId = null;
const mostrata = {};        // posizione attualmente disegnata per ogni auto
const correzione = {};      // scarto da riassorbire gradualmente

function previste(){
  if (!liveDati) return [];
  const dt = (performance.now() - liveT0) / 1000;
  return (liveDati.cars || []).map(c => {
    const k = String(c.i);
    let d;
    if (c.pit || !c.lt || c.lt <= 0){
      d = c.d;                                   // fermo ai box: nessuna previsione
    } else {
      d = (c.d + dt / c.lt) % 1;                 // avanza al proprio ritmo
    }
    if (mostrata[k] == null) mostrata[k] = d;
    // riassorbo lo scarto in modo continuo invece di saltare alla nuova posizione
    let diff = d - mostrata[k];
    if (diff > 0.5) diff -= 1; else if (diff < -0.5) diff += 1;
    mostrata[k] = (mostrata[k] + diff * 0.18 + 1) % 1;
    return {...c, d: mostrata[k], dReale: c.d};
  });
}
function fermaRaf(){ if (rafId) cancelAnimationFrame(rafId); rafId = null; }
function avviaRaf(){
  fermaRaf();
  const passo = () => {
    if (!liveDati) { rafId = requestAnimationFrame(passo); return; }
    const cars = previste();
    const nomi = {}; (liveDati.piloti||[]).forEach(p => nomi[p.i] = p);
    if (liveOutline && liveOutline.disponibile) disegnaMappa(cars, nomi, liveDati.me, ghostD);
    else disegnaBarra(cars, nomi, liveDati.me, ghostD);
    aggiornaDistacchiFluidi(cars);
    rafId = requestAnimationFrame(passo);
  };
  rafId = requestAnimationFrame(passo);
}
let ghostD = null;

// I distacchi seguono le posizioni previste, cosi' scorrono invece di scattare
function aggiornaDistacchiFluidi(cars){
  if (!liveDati || lvTab !== "timing") return;
  const perId = {}; cars.forEach(c => perId[c.i] = c);
  document.querySelectorAll("[data-gapcl]").forEach(el => {
    const c = perId[+el.dataset.gapcl], cap = perId[+el.dataset.cap];
    if (!c || !cap) return;
    if (c === cap){ el.textContent = "leader"; return; }
    const g = (cap.l + cap.d) - (c.l + c.d), rif = cap.lt || c.lt;
    el.textContent = Math.abs(g) >= 1 ? `+${Math.trunc(Math.abs(g))} giri`
                   : rif ? `+${(Math.abs(g)*rif).toFixed(1)}` : "—";
  });
  document.querySelectorAll("[data-gapprec]").forEach(el => {
    const c = perId[+el.dataset.gapprec], pr = perId[+el.dataset.prec];
    if (!c || !pr) { el.textContent = "—"; return; }
    const g = (pr.l + pr.d) - (c.l + c.d), rif = pr.lt || c.lt;
    el.textContent = Math.abs(g) >= 1 ? `+${Math.trunc(Math.abs(g))} giri`
                   : rif ? `+${(Math.abs(g)*rif).toFixed(1)}` : "—";
  });
}

/* Aggiornamento rimandato mentre l'utente sta interagendo: senza questo, un menu aperto si
   richiude e una colonna in movimento sparisce sotto le dita a ogni aggiornamento. */
function interazioneInCorso(){
  if (document.querySelector(".chanmenu:not([hidden])")) return true;   // un menu e' aperto
  if (document.querySelector("th.trascino")) return true;               // colonna in movimento
  if (document.activeElement && ["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName)) return true;
  const t = document.getElementById("timbox");
  if (t && t.matches(":hover") && lvTab === "timing") return true;      // mouse sulla tabella
  return false;
}

/* ---- Scheda 1: Overview & Timing ---- */
let liveClassi = null;
try { const r = localStorage.getItem("classiVisibili");
      if (r) liveClassi = new Set(JSON.parse(r)); } catch(e){}
function salvaClassi(){
  try {
    if (liveClassi) localStorage.setItem("classiVisibili", JSON.stringify([...liveClassi]));
    else localStorage.removeItem("classiVisibili");
  } catch(e){}
}
function nomiClassi(ordinate, nomi){
  const conta = {};
  ordinate.forEach(c => {
    const k = String(c.cl), m = (nomi[c.i]||{}).auto || "?";
    conta[k] = conta[k] || {}; conta[k][m] = (conta[k][m]||0) + 1;
  });
  const out = {};
  Object.entries(conta).forEach(([k,mod]) => { out[k] = Object.entries(mod).sort((a,b)=>b[1]-a[1])[0][0]; });
  return out;
}

// Colonne della classifica. "ord" indica come ordinare quella colonna (assente = non ordinabile).
const COL_TIMING = [
  {k:"sel",    t:"",              fisso:true},
  {k:"pos",    t:"Pos",           ord:r=>r.c.p},
  {k:"clpos",  t:"Cl.",           ord:r=>r.c.cp},
  {k:"pilota", t:"Pilota",        ord:r=>(r.p.n||"").toLowerCase()},
  {k:"cat",    t:"Categoria",     ord:r=>r.cat},
  {k:"giro",   t:"Giro",          ord:r=>r.c.l},
  {k:"ultimo", t:"Ultimo",        ord:r=>r.c.lt},
  {k:"best",   t:"Migliore",      ord:r=>r.c.bt},
  {k:"passo",  t:"Passo",         ord:r=>r.D.passo},
  {k:"gapcl",  t:"Da leader cl.", ord:r=>r.gapCl},
  {k:"gapprec",t:"Precedente",    ord:r=>r.gapPrec},
  {k:"stint",  t:"Stint",         ord:r=>r.D.stint},
  {k:"box",    t:"Box",           ord:r=>r.D.pit_durata},
];

function renderTiming(body, d, ordinate, nomi, der){
  const me = d.me;
  const etichette = nomiClassi(ordinate, nomi);
  const classi = [...new Set(ordinate.map(c=>String(c.cl)))];
  const visibile = c => !liveClassi || liveClassi.has(String(c.cl)) || c.i === me;
  const inGara = ordinate.filter(visibile);          // gia' in ordine di posizione

  const leaderCl = {};
  ordinate.forEach(c => { const k = String(c.cl); if (!(k in leaderCl)) leaderCl[k] = c; });
  const tot = c => (c.l||0)+(c.d||0);
  const secondi = (a,b) => {
    if (!a||!b||a===b) return null;
    const g = tot(b)-tot(a), rif = b.lt || a.lt;
    if (Math.abs(g) >= 1) return Math.trunc(g)*10000;   // giri di distacco: valore grande, ordina in fondo
    return rif ? Math.abs(g)*rif : Math.abs(g)*100;
  };
  const testoGap = (a,b) => {
    if (!a||!b||a===b) return "—";
    const g = tot(b)-tot(a);
    if (Math.abs(g) >= 1) return `+${Math.trunc(Math.abs(g))} giri`;
    const rif = b.lt || a.lt;
    return rif ? `+${(Math.abs(g)*rif).toFixed(1)}` : `+${(Math.abs(g)*100).toFixed(0)}%`;
  };

  // Le righe si costruiscono SEMPRE sull'ordine di gara: cosi' il distacco dal precedente
  // resta quello vero anche quando la tabella viene ordinata per un'altra colonna.
  const righe = inGara.map((c,idx) => {
    const p = nomi[c.i]||{}, D = der[String(c.i)]||{};
    const cap = leaderCl[String(c.cl)], prec = idx>0 ? inGara[idx-1] : null;
    return {c, p, D, io:c.i===me, cat:etichette[String(c.cl)]||"—", cap, prec,
            gapCl: c===cap ? 0 : secondi(c,cap), gapPrec: prec ? secondi(c,prec) : null,
            gapClTxt: c===cap ? "leader" : testoGap(c,cap),
            gapPrecTxt: prec ? testoGap(c,prec) : "—"};
  });

  const st = TAB.stato("timing", COL_TIMING);
  const cols = TAB.attive(st, COL_TIMING);
  const mostrate = TAB.ordina(righe, st, COL_TIMING);

  // Contenuto di ogni cella. Le celle portano un identificativo cosi' possono essere
  // aggiornate sul posto, senza ricostruire la tabella sotto le mani dell'utente.
  const contenuto = (k, r) => {
    switch(k){
      case "sel":    return `<input type="checkbox" class="lvchk" data-car="${r.c.i}" ${liveSel.includes(r.c.i)?"checked":""}>`;
      case "pos":    return String(r.c.p||"-");
      case "clpos":  return String(r.c.cp||"-");
      case "pilota": return `<span class="clsdot" style="background:${colClasse(r.c.cl)}"></span>${r.p.num?`<span class="lvnum">${esc(String(r.p.num))}</span>`:""}<span class="lvname" data-car="${r.c.i}">${esc(r.p.n||("Auto "+r.c.i))}</span>${r.c.pit?' <span class="lvtag">BOX</span>':""}`;
      case "cat":    return esc(r.cat);
      case "giro":   return String(r.c.l||0);
      case "ultimo": return r.c.lt?fmt(r.c.lt):"—";
      case "best":   return r.c.bt?fmt(r.c.bt):"—";
      case "passo":  return r.D.passo?fmt(r.D.passo):"—";
      case "gapcl":  return r.gapClTxt;
      case "gapprec":return r.gapPrecTxt;
      case "stint":  return `${r.D.stint!=null?r.D.stint:"—"}${r.D.soste?`<span class="cpos">${r.D.soste}</span>`:""}`;
      case "box":    return r.D.in_pit_da!=null?`<b class="pitnow">${r.D.in_pit_da}s</b>`:(r.D.pit_durata!=null?r.D.pit_durata+"s":"—");
    }
    return "";
  };
  const classeCella = k => k==="clpos" ? "pwnum cl" : k==="best" ? "pwnum best"
                        : k==="cat" ? "pwnum cls" : k==="sel"||k==="pilota" ? "" : "pwnum";
  const attrFluidi = (k, r) => k==="gapcl" ? ` data-gapcl="${r.c.i}" data-cap="${r.cap?r.cap.i:""}"`
                             : k==="gapprec" ? ` data-gapprec="${r.c.i}" data-prec="${r.prec?r.prec.i:""}"` : "";
  const cella = (col, r) => `<td class="${classeCella(col.k)}" data-c="${col.k}"${attrFluidi(col.k,r)}>${contenuto(col.k,r)}</td>`;

  // Se colonne, ordinamento e insieme delle auto non sono cambiati, non ricostruisco:
  // aggiorno solo i valori dentro le celle. Cosi' menu aperti, scorrimento e trascinamenti
  // in corso non vengono interrotti a ogni secondo.
  const firma = JSON.stringify([cols.map(c=>c.k), st.sort, mostrate.map(r=>r.c.i), liveInPausa]);
  const vecchia = body.querySelector("table.tim");
  if (vecchia && body.dataset.firma === firma){
    mostrate.forEach(r => {
      const tr = vecchia.querySelector(`tr[data-row="${r.c.i}"]`);
      if (!tr) return;
      tr.className = `${r.io?"lvme-row":""} ${r.c.pit?"lvpit":""} ${liveSel.includes(r.c.i)?"lvsel":""}`;
      cols.forEach(col => {
        if (col.k === "sel") return;                       // non tocco la spunta in uso
        const td = tr.querySelector(`td[data-c="${col.k}"]`);
        if (!td) return;
        const nuovo = contenuto(col.k, r);
        if (td.innerHTML !== nuovo) td.innerHTML = nuovo;
        if (col.k === "gapcl"){ td.dataset.cap = r.cap ? r.cap.i : ""; }
        if (col.k === "gapprec"){ td.dataset.prec = r.prec ? r.prec.i : ""; }
      });
    });
    const c0 = document.getElementById("ctxlive");
    if (c0) c0.innerHTML = `Classifica · ${righe.length} di ${ordinate.length} auto
      <span class="lvdot">● aggiornato ${d.eta}s fa</span>`;
    return;
  }
  body.dataset.firma = firma;

  body.innerHTML = `
    <div class="board">
      <div class="ctx" id="ctxlive">Classifica · ${righe.length} di ${ordinate.length} auto
        <span class="lvdot">● aggiornato ${d.eta}s fa</span></div>
      <div class="barrastrum">
        <div class="chansel">
          <button class="chanbtn" id="clsbtn">Categorie <span>(${liveClassi?liveClassi.size:classi.length}/${classi.length})</span> ▾</button>
          <div class="chanmenu" id="clsmenu" hidden>
            ${classi.map(k=>`<label class="chanrow"><input type="checkbox" data-cls="${k}"
              ${!liveClassi||liveClassi.has(k)?"checked":""}>
              <span class="clsdot" style="background:${colClasse(+k)}"></span>${esc(etichette[k]||("classe "+k))}</label>`).join("")}
          </div>
        </div>
        ${TAB.menu(st, COL_TIMING, "timing")}
        <button class="chanbtn ${liveInPausa?"inpausa":""}" id="pausabtn">${liveInPausa?"▶ Riprendi":"⏸ Pausa"}</button>
      </div>

      <div class="tabbox" id="timbox">
      <table class="pwtab tim"><thead><tr>${cols.map(c=>TAB.th(c,st)).join("")}</tr></thead><tbody>
      ${mostrate.map(r => `<tr data-row="${r.c.i}" class="${r.io?"lvme-row":""} ${r.c.pit?"lvpit":""} ${liveSel.includes(r.c.i)?"lvsel":""}">
        ${cols.map(c=>cella(c,r)).join("")}</tr>`).join("")}
      </tbody></table></div>
      <div class="telhint">Trascina un'intestazione per spostare la colonna, cliccala per ordinare.
      Il distacco è dal <b>leader della propria categoria</b>; la colonna "Precedente" resta
      riferita a chi ti precede <b>in classifica</b> anche quando ordini per un'altra colonna.
      La tua auto resta visibile anche nascondendo la sua categoria.
      Le soste degli avversari sono <b>dedotte</b> dai passaggi in corsia box.</div>
    </div>`;

  const cb = document.getElementById("clsbtn"), cm = document.getElementById("clsmenu");
  cb.onclick = () => { cm.hidden = !cm.hidden; };
  cm.querySelectorAll("[data-cls]").forEach(k => k.onchange = () => {
    if (!liveClassi) liveClassi = new Set(classi);
    if (k.checked) liveClassi.add(k.dataset.cls); else liveClassi.delete(k.dataset.cls);
    if (liveClassi.size === classi.length) liveClassi = null;
    salvaClassi(); aggiornaLive();
  });
  document.getElementById("pausabtn").onclick = () => { liveInPausa = !liveInPausa; aggiornaLive(); };
  TAB.attiva(body, "timing", COL_TIMING, st, () => aggiornaLive());
  ridimensionabile(document.getElementById("timbox"), "classifica");
  body.querySelectorAll(".lvname").forEach(n => n.onclick = () => {
    stSel = [+n.dataset.car]; stDa = null; stA = null; lvTab = "storico";
    document.querySelectorAll("[data-lv]").forEach(x => x.classList.toggle("on", x.dataset.lv==="storico"));
    aggiornaLive();
  });
  body.querySelectorAll(".lvchk").forEach(k => k.onchange = () => {
    const i = +k.dataset.car;
    if (k.checked){ liveSel.push(i); if (liveSel.length>2) liveSel.shift(); }
    else liveSel = liveSel.filter(x=>x!==i);
    aggiornaLive();
  });
}

/* ---- Scheda 2: Strategia dal vivo ---- */
// Preferenze del pannello, ricordate fra una sessione e l'altra
const STRAT_DEF = {margine:1.0, flow:2.5, gomme2:8, gomme4:13, simultaneo:true, freddo:1.2};
function loadStrat(){
  try { const r = localStorage.getItem("stratPrefs");
        if (r) return {...STRAT_DEF, ...JSON.parse(r)}; } catch(e){}
  return {...STRAT_DEF};
}
function saveStrat(p){ try { localStorage.setItem("stratPrefs", JSON.stringify(p)); } catch(e){} }
let stratP = loadStrat();

// Modello del giro: peso della benzina + degrado gomme + malus da gomme fredde.
// Le gomme fredde costano molto sul giro di uscita, meno sul secondo, e dal terzo sono a regime.
function tempoGiro(par, eta, benzina, freddo){
  const malus = eta === 0 ? freddo : eta === 1 ? freddo*0.5 : eta === 2 ? freddo*0.2 : 0;
  return par.base_time + par.k_fuel*benzina + par.deg*eta + malus;
}
// Durata della sosta: il rifornimento e il cambio gomme possono essere contemporanei o in fila
function durataSosta(litri, gomme, cfg){
  const tRif = litri * cfg.flow;
  const tGom = gomme === 0 ? 0 : gomme === 2 ? cfg.gomme2 : cfg.gomme4;
  return cfg.perdita + (cfg.simultaneo ? Math.max(tRif, tGom) : tRif + tGom);
}
// Simula il resto della gara con UNA sosta al giro indicato
function simulaResto(giriRimasti, giroSosta, gomme, etaAttuale, benzinaOra, par, cfg){
  let t = 0, eta = etaAttuale, f = benzinaOra;
  const litriDopo = (giriRimasti - giroSosta) * par.fuel_per_lap + cfg.margine;
  if (litriDopo > cfg.serbatoio) return null;
  for (let i = 0; i < giroSosta; i++){
    if (f < par.fuel_per_lap * 0.2) return null;      // resta a secco prima della sosta
    t += tempoGiro(par, eta, f, cfg.freddo);
    f -= par.fuel_per_lap; eta++;
  }
  t += durataSosta(litriDopo, gomme, cfg);
  f = litriDopo;
  if (gomme > 0) eta = 0;
  for (let i = giroSosta; i < giriRimasti; i++){
    t += tempoGiro(par, eta, f, cfg.freddo);
    f -= par.fuel_per_lap; eta++;
  }
  return t;
}

function renderStrategia(body, d, ordinate, der){
  const S = d.sessione || {}, M = d.mia || {};
  const mia = ordinate.find(c => c.i === d.me);
  const P = liveParams;
  if (!P || !P.fuel_per_lap || !P.base_time){
    body.innerHTML = `<div class="board"><div class="ctx">Parametri non disponibili</div>
      <p class="warnbox">Per calcolare la strategia servono consumo e ritmo misurati dal tuo
      archivio su questa pista con questa auto. Fai qualche giro salvato e torneranno da soli.</p></div>`;
    return;
  }
  // giri rimanenti: espliciti se la gara è a giri, altrimenti stimati dal tempo
  const ritmo = P.base_time + P.k_fuel * (M.fuel || 30);
  let giriRimasti = (S.giriRimasti != null && S.giriRimasti < 9999) ? S.giriRimasti
                  : (S.tempoRimasto != null && S.tempoRimasto < 86400 ? Math.ceil(S.tempoRimasto / ritmo) : null);
  const stintOra = (der[String(d.me)] || {}).stint || 0;
  const benzina = M.fuel;

  const cfg = {...stratP, perdita: P.pit_loss != null ? Math.max(8, P.pit_loss - 12) : 20,
               serbatoio: stratP.serbatoio || 100};

  // --- benzina ---
  let stato = "";
  if (benzina != null && giriRimasti){
    const serve = giriRimasti * P.fuel_per_lap + cfg.margine;
    const diff = benzina - serve;
    const giriPossibili = Math.floor((benzina - cfg.margine) / P.fuel_per_lap);
    const risparmio = diff < 0 ? (-diff) / giriRimasti : 0;
    stato = `
      <div class="board" style="margin-bottom:12px">
        <div class="ctx">Benzina</div>
        <div class="pwgrid" style="padding-top:12px">
          <div class="mtbig"><span>A bordo</span><b>${benzina.toFixed(1)} L</b></div>
          <div class="mtbig"><span>Consumo</span><b>${P.fuel_per_lap.toFixed(2)} L/giro</b></div>
          <div class="mtbig"><span>Autonomia</span><b>${giriPossibili} giri</b></div>
          <div class="mtbig"><span>Serve per finire</span><b>${serve.toFixed(1)} L</b></div>
          <div class="mtbig"><span>${diff>=0?"Avanza":"Manca"}</span><b class="${diff>=0?"okv":"kov"}">${Math.abs(diff).toFixed(1)} L</b></div>
          <div class="mtbig"><span>Giri alla fine</span><b>${giriRimasti}</b></div>
        </div>
        ${diff < 0 ? `<p class="warnbox"><b>Lift &amp; coast:</b> per arrivare in fondo con
          ${cfg.margine.toFixed(1)} L di margine devi risparmiare <b>${risparmio.toFixed(2)} L/giro</b>,
          cioè circa il <b>${(risparmio/P.fuel_per_lap*100).toFixed(0)}%</b> del consumo attuale.
          In alternativa serve una sosta.</p>`
        : `<p class="warnbox">Con questo consumo arrivi in fondo senza fermarti, con
          ${diff.toFixed(1)} L oltre il margine di sicurezza.</p>`}
      </div>`;
  }

  // --- confronto strategie ---
  let tabella = `<div class="empty">Servono i giri rimanenti per confrontare le strategie.</div>`;
  if (giriRimasti && benzina != null){
    const scenari = [
      {nome:"Solo benzina", gomme:0},
      {nome:"Benzina + 2 gomme", gomme:2},
      {nome:"Benzina + 4 gomme", gomme:4},
    ].map(sc => {
      let best = null;
      for (let g = 1; g <= giriRimasti - 1; g++){
        const t = simulaResto(giriRimasti, g, sc.gomme, stintOra, benzina, P, cfg);
        if (t != null && (best == null || t < best.t)) best = {t, g};
      }
      return {...sc, ...(best || {})};
    });
    const validi = scenari.filter(s => s.t != null);
    const mig = validi.length ? validi.reduce((a,b)=>b.t<a.t?b:a) : null;
    tabella = `
      <div class="board">
        <div class="ctx">Confronto strategie · ${giriRimasti} giri alla fine</div>
        <table class="pwtab"><thead><tr>
          <th>Scenario</th><th>Sosta al giro</th><th>Durata sosta</th><th>Tempo totale</th><th>Differenza</th>
        </tr></thead><tbody>
        ${scenari.map(s => {
          if (s.t == null) return `<tr class="pwno"><td>${s.nome}</td><td colspan="4">non fattibile con questo serbatoio</td></tr>`;
          const litri = (giriRimasti - s.g) * P.fuel_per_lap + cfg.margine;
          return `<tr class="${s===mig?"pwbest":""}">
            <td>${s.nome}${s===mig?" ★":""}</td>
            <td class="pwnum">fra ${s.g} gir${s.g==1?"o":"i"}</td>
            <td class="pwnum">${durataSosta(litri, s.gomme, cfg).toFixed(1)} s</td>
            <td class="pwnum">${fmt(s.t)}</td>
            <td class="pwnum">${s===mig?"—":"+"+(s.t-mig.t).toFixed(1)+" s"}</td></tr>`;
        }).join("")}
        </tbody></table>
        ${mig ? `<div class="pwnote">Conviene <b>${mig.nome.toLowerCase()}</b>, fermandosi fra
          <b>${mig.g} gir${mig.g==1?"o":"i"}</b> (giro ${(mia?mia.l:0)+mig.g}).</div>` : ""}
        <div class="telhint">Il modello tiene conto del peso della benzina, del degrado gomme e del
        malus da gomme fredde nei primi giri dopo la sosta. Vale in condizioni pulite:
        neutralizzazioni e traffico possono ribaltare qualunque calcolo.</div>
      </div>`;
  }

  body.innerHTML = stato + tabella + `
    <div class="board" style="margin-top:12px">
      <div class="ctx">Parametri della sosta</div>
      <div class="pwgrid" style="padding-top:12px">
        <label>Margine sicurezza (L)<input class="txtin" id="s_marg" value="${stratP.margine}"><span class="pwsrc">benzina che vuoi avere al traguardo</span></label>
        <label>Rifornimento (s/L)<input class="txtin" id="s_flow" value="${stratP.flow}"></label>
        <label>Cambio 2 gomme (s)<input class="txtin" id="s_g2" value="${stratP.gomme2}"></label>
        <label>Cambio 4 gomme (s)<input class="txtin" id="s_g4" value="${stratP.gomme4}"></label>
        <label>Malus gomme fredde (s)<input class="txtin" id="s_cold" value="${stratP.freddo}"><span class="pwsrc">perso sul giro di uscita</span></label>
        <label>Serbatoio (L)<input class="txtin" id="s_tank" value="${stratP.serbatoio||100}"></label>
      </div>
      <label class="switchrow"><input type="checkbox" id="s_sim" ${stratP.simultaneo?"checked":""}><span>Benzina e gomme contemporaneamente</span></label>
      <div class="telhint">Perdita in corsia box: <b>${cfg.perdita.toFixed(0)} s</b>${P.pit_loss!=null?` (dal tuo archivio: sosta completa ~${P.pit_loss} s)`:" (valore di partenza)"}</div>
    </div>`;

  const leg = (id, key) => { const el = document.getElementById(id); if (!el) return;
    el.onchange = () => { const v = el.type === "checkbox" ? el.checked : parseFloat(el.value);
      if (v != null && !Number.isNaN(v)) { stratP[key] = v; saveStrat(stratP); aggiornaLive(); } }; };
  leg("s_marg","margine"); leg("s_flow","flow"); leg("s_g2","gomme2");
  leg("s_g4","gomme4"); leg("s_cold","freddo"); leg("s_tank","serbatoio"); leg("s_sim","simultaneo");
}

/* ---- Scheda 4: Analisi giri e stint ---- */
let stSel = [], stDa = null, stA = null, stPuliti = true;

// Filtro giri sporchi: scarta out-lap, traffico ed errori confrontando con la mediana del pilota
function filtraPuliti(giri, soglia){
  const t = giri.map(g=>g.t).filter(x=>x>0).sort((a,b)=>a-b);
  if (t.length < 3) return giri;
  const med = t[Math.floor(t.length/2)];
  return giri.filter(g => g.t <= med * soglia);
}

function renderStorico(body, d, ordinate, nomi, der){
  const storico = d.storico || {};
  const conDati = ordinate.filter(c => (storico[String(c.i)]||[]).length >= 2);
  if (!conDati.length){
    body.innerHTML = `<div class="board"><div class="ctx">Analisi giri</div>
      <p class="warnbox">Servono almeno due giri completati per costruire il grafico del passo.
      I dati si accumulano man mano che la sessione prosegue.</p></div>`;
    return;
  }
  // di partenza seleziono me stesso
  if (!stSel.length) stSel = [d.me != null && storico[String(d.me)] ? d.me : conDati[0].i];
  stSel = stSel.filter(i => storico[String(i)]);

  // intervallo di giri disponibile
  const tuttiGiri = stSel.flatMap(i => (storico[String(i)]||[]).map(g=>g.l));
  const minG = tuttiGiri.length ? Math.min(...tuttiGiri) : 1;
  const maxG = tuttiGiri.length ? Math.max(...tuttiGiri) : 1;
  if (stDa == null || stDa < minG) stDa = minG;
  if (stA == null || stA > maxG) stA = maxG;

  // stint del pilota di riferimento, per i pulsanti di isolamento automatico
  const rifSoste = (d.soste || {})[String(stSel[0])] || [];
  const stint = [];
  let inizio = minG;
  rifSoste.forEach(l => { if (l > inizio && l <= maxG){ stint.push([inizio, l]); inizio = l + 1; } });
  if (inizio <= maxG) stint.push([inizio, maxG]);   // niente stint vuoto dopo l'ultima sosta

  body.innerHTML = `
    <div class="board" style="margin-bottom:12px">
      <div class="ctx">Piloti da confrontare · massimo 5</div>
      <div class="stpick">${ordinate.map(c => {
        const p = nomi[c.i]||{}, n = (storico[String(c.i)]||[]).length;
        if (!n) return "";
        return `<label class="stchip ${stSel.includes(c.i)?"on":""}">
          <input type="checkbox" data-st="${c.i}" ${stSel.includes(c.i)?"checked":""}>
          <span class="clsdot" style="background:${colClasse(c.cl)}"></span>${esc(p.n||("Auto "+c.i))}
          <i>${n} giri</i></label>`;
      }).join("")}</div>
    </div>

    <div class="board" style="margin-bottom:12px">
      <div class="ctx">Finestra di analisi</div>
      <div class="strow">
        <label>Dal giro <input class="txtin small" id="st_da" type="number" value="${stDa}" min="${minG}" max="${maxG}"></label>
        <label>Al giro <input class="txtin small" id="st_a" type="number" value="${stA}" min="${minG}" max="${maxG}"></label>
        <span class="presets">${stint.map((s,i)=>`<button class="btn small ghost" data-stint="${i}">Stint ${i+1}</button>`).join("")}
          <button class="btn small ghost" data-stint="tutto">Tutto</button></span>
        <label class="switchrow" style="padding:0"><input type="checkbox" id="st_pul" ${stPuliti?"checked":""}><span>Solo giri puliti</span></label>
      </div>
    </div>

    <div class="board" style="margin-bottom:12px">
      <div class="ctx">Passo sul giro</div>
      <div class="chartbox" id="stchartbox"><canvas id="stchart"></canvas></div>
      <div class="telhint" id="stinfo"></div>
    </div>

    <div class="board">
      <div class="ctx">Tempi giro per giro</div>
      <div class="sttab" id="sttab"></div>
    </div>`;

  body.querySelectorAll("[data-st]").forEach(k => k.onchange = () => {
    const i = +k.dataset.st;
    if (k.checked){ if (!stSel.includes(i)){ stSel.push(i); if (stSel.length>5) stSel.shift(); } }
    else stSel = stSel.filter(x=>x!==i);
    if (!stSel.length) stSel = [i];
    aggiornaLive();
  });
  body.querySelectorAll("[data-stint]").forEach(b => b.onclick = () => {
    if (b.dataset.stint === "tutto"){ stDa = minG; stA = maxG; }
    else { const s = stint[+b.dataset.stint]; stDa = s[0]; stA = s[1]; }
    aggiornaLive();
  });
  const da = document.getElementById("st_da"), a = document.getElementById("st_a");
  da.onchange = () => { stDa = Math.max(minG, Math.min(maxG, +da.value||minG)); aggiornaLive(); };
  a.onchange  = () => { stA  = Math.max(minG, Math.min(maxG, +a.value||maxG)); aggiornaLive(); };
  document.getElementById("st_pul").onchange = e => { stPuliti = e.target.checked; aggiornaLive(); };

  disegnaPasso(d, nomi, storico);
}

function disegnaPasso(d, nomi, storico){
  const cv = document.getElementById("stchart"); if (!cv) return;
  const dpr = Math.min(window.devicePixelRatio||1,2);
  const H = Math.max(160, Math.round((cv.parentElement.clientHeight || 300) - 4));
  cv.style.width="100%"; cv.style.height=H+"px";
  cv.width = cv.clientWidth*dpr; cv.height = H*dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr,dpr);
  const w = cv.clientWidth, padL=58, padR=14, padT=14, padB=30;
  ctx.clearRect(0,0,w,H);

  const COL = ["#e10600","#8ab4ff","#35d07f","#f2b63d","#c07bff"];
  const serie = stSel.map((i,k) => {
    let g = (storico[String(i)]||[]).filter(x => x.l >= stDa && x.l <= stA && x.t > 0);
    if (stPuliti) g = filtraPuliti(g, 1.02);   // oltre il 2% sopra la mediana = giro sporco
    return {i, col: COL[k%COL.length], nome: (nomi[i]||{}).n || ("Auto "+i), giri: g};
  }).filter(s => s.giri.length);

  const info = document.getElementById("stinfo");
  if (!serie.length){
    ctx.fillStyle="#8a8a92"; ctx.font="12px 'Titillium Web'"; ctx.textAlign="center";
    ctx.fillText("Nessun giro in questa finestra.", w/2, H/2); ctx.textAlign="start";
    if (info) info.textContent = "";
    disegnaTabella(serie);
    return;
  }
  const tutti = serie.flatMap(s=>s.giri);
  const tMin = Math.min(...tutti.map(g=>g.t)), tMax = Math.max(...tutti.map(g=>g.t));
  const marg = Math.max(0.2, (tMax-tMin)*0.12);
  const yMin = tMin-marg, yMax = tMax+marg;
  const X = l => padL + (l-stDa)/Math.max(1,(stA-stDa))*(w-padL-padR);
  const Y = t => H-padB - (t-yMin)/((yMax-yMin)||1)*(H-padT-padB);

  // griglia
  ctx.strokeStyle="#26262a"; ctx.lineWidth=1; ctx.font="10px 'Chivo Mono',monospace"; ctx.fillStyle="#8a8a92";
  const passoY = (yMax-yMin)/4;
  for (let k=0;k<=4;k++){
    const t = yMin + passoY*k;
    ctx.beginPath(); ctx.moveTo(padL, Y(t)); ctx.lineTo(w-padR, Y(t)); ctx.stroke();
    ctx.textAlign="right"; ctx.fillText(fmt(t), padL-6, Y(t)+3);
  }
  const nEtich = Math.min(8, Math.max(2, stA-stDa));
  for (let k=0;k<=nEtich;k++){
    const l = Math.round(stDa + (stA-stDa)*k/nEtich);
    ctx.beginPath(); ctx.moveTo(X(l), padT); ctx.lineTo(X(l), H-padB); ctx.stroke();
    ctx.textAlign="center"; ctx.fillText(String(l), X(l), H-padB+14);
  }
  ctx.fillText("giro", (padL+w-padR)/2, H-4); ctx.textAlign="start";

  // linee
  serie.forEach(s => {
    ctx.strokeStyle=s.col; ctx.lineWidth=1.8; ctx.beginPath();
    s.giri.forEach((g,i)=> i?ctx.lineTo(X(g.l),Y(g.t)):ctx.moveTo(X(g.l),Y(g.t)));
    ctx.stroke();
    ctx.fillStyle=s.col;
    s.giri.forEach(g=>{ ctx.beginPath(); ctx.arc(X(g.l),Y(g.t),2.5,0,7); ctx.fill(); });
  });
  // legenda con media della finestra
  if (info) info.innerHTML = serie.map(s => {
    const med = s.giri.reduce((a,b)=>a+b.t,0)/s.giri.length;
    const best = Math.min(...s.giri.map(g=>g.t));
    return `<span class="stleg"><i style="background:${s.col}"></i>${esc(s.nome)} ·
      ${s.giri.length} giri · media ${fmt(med)} · migliore ${fmt(best)}</span>`;
  }).join("") + (stPuliti ? ` <span class="stnota">giri sporchi nascosti</span>` : "");
  disegnaTabella(serie);
  ridimensionabile(document.getElementById("stchartbox"), "passo_grafico",
    () => disegnaPasso(d, nomi, storico));
}

function disegnaTabella(serie){
  const host = document.getElementById("sttab"); if (!host) return;
  if (!serie.length){ host.innerHTML = `<div class="empty" style="padding:14px">Nessun dato.</div>`; return; }
  const giri = [...new Set(serie.flatMap(s=>s.giri.map(g=>g.l)))].sort((a,b)=>a-b);
  // Le righe: un valore per pilota piu' il delta fra i primi due
  const righe = giri.map(l => {
    const t = serie.map(s => (s.giri.find(g=>g.l===l)||{}).t || null);
    return {l, t, delta: (t[0]!=null && t[1]!=null) ? t[0]-t[1] : null,
            migliore: Math.min(...t.filter(x=>x!=null))};
  });
  // Le colonne dei piloti sono dinamiche: cambiano con la selezione
  const COL_GIRI = [{k:"giro", t:"Giro", ord:r=>r.l}]
    .concat(serie.map((s,i)=>({k:"pil"+i, t:s.nome, ord:r=>r.t[i], col:s.col})))
    .concat(serie.length>1 ? [{k:"delta", t:"Delta", ord:r=>r.delta}] : []);

  const st = TAB.stato("giri", COL_GIRI);
  const cols = TAB.attive(st, COL_GIRI);
  const ordinate = TAB.ordina(righe, st, COL_GIRI);

  const cella = (c, r) => {
    if (c.k === "giro") return `<td class="pwnum">${r.l}</td>`;
    if (c.k === "delta") return `<td class="pwnum ${r.delta!=null?(r.delta<0?"okv":"kov"):""}">${r.delta!=null?((r.delta>0?"+":"")+r.delta.toFixed(3)):"—"}</td>`;
    const i = +c.k.slice(3), t = r.t[i];
    return `<td class="pwnum ${t===r.migliore?"best":""}">${t!=null?fmt(t):"—"}</td>`;
  };

  host.innerHTML = `<div class="barrastrum">${TAB.menu(st, COL_GIRI, "giri")}</div>
    <table class="pwtab tim"><thead><tr>${cols.map(c=>
      c.col ? TAB.th(c,st).replace("<th ", `<th style="border-top:2px solid ${c.col}" `) : TAB.th(c,st)
    ).join("")}</tr></thead><tbody>
    ${ordinate.map(r => `<tr>${cols.map(c=>cella(c,r)).join("")}</tr>`).join("")}
    </tbody></table>`;
  TAB.attiva(host, "giri", COL_GIRI, st, () => aggiornaLive());
  ridimensionabile(host, "tabella_giri");
}
